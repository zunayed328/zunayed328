
<svg width="1200" height="300" viewBox="0 0 1200 300"
     xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0D1117"/>
      <stop offset="50%"  stop-color="#0D1F35"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>
    <radialGradient id="glowLeft" cx="25%" cy="50%" r="40%">
      <stop offset="0%"   stop-color="#00D9FF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00D9FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRight" cx="75%" cy="50%" r="40%">
      <stop offset="0%"   stop-color="#FFD700" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#FFD700" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#00D9FF" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#00D9FF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#FFD700" stop-opacity="0.6"/>
    </linearGradient>
    <clipPath id="bannerClip">
      <rect width="1200" height="300" rx="12"/>
    </clipPath>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="textGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g clip-path="url(#bannerClip)">
    <!-- Background -->
    <rect width="1200" height="300" fill="url(#bgGrad)"/>
    <rect width="1200" height="300" fill="url(#glowLeft)"/>
    <rect width="1200" height="300" fill="url(#glowRight)"/>

    <!-- Grid -->
    <g opacity="0.06" stroke="#00D9FF" stroke-width="0.5">
      <line x1="100"  y1="0" x2="100"  y2="300"/>
      <line x1="200"  y1="0" x2="200"  y2="300"/>
      <line x1="300"  y1="0" x2="300"  y2="300"/>
      <line x1="400"  y1="0" x2="400"  y2="300"/>
      <line x1="500"  y1="0" x2="500"  y2="300"/>
      <line x1="600"  y1="0" x2="600"  y2="300"/>
      <line x1="700"  y1="0" x2="700"  y2="300"/>
      <line x1="800"  y1="0" x2="800"  y2="300"/>
      <line x1="900"  y1="0" x2="900"  y2="300"/>
      <line x1="1000" y1="0" x2="1000" y2="300"/>
      <line x1="1100" y1="0" x2="1100" y2="300"/>
      <line x1="0" y1="75"  x2="1200" y2="75"/>
      <line x1="0" y1="150" x2="1200" y2="150"/>
      <line x1="0" y1="225" x2="1200" y2="225"/>
    </g>

    <!-- Particles -->
    <circle cx="80" cy="60" r="2" fill="#00D9FF" opacity="0.6" filter="url(#glow)">
      <animate attributeName="cy" values="60;40;60" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;1;0.6" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="200" cy="200" r="1.5" fill="#FFD700" opacity="0.5">
      <animate attributeName="cy" values="200;180;200" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1100" cy="80" r="2" fill="#00D9FF" opacity="0.4">
      <animate attributeName="cy" values="80;60;80" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="950" cy="220" r="1.5" fill="#FFD700" opacity="0.5">
      <animate attributeName="cy" values="220;200;220" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="350" cy="40" r="1" fill="#00D9FF" opacity="0.7">
      <animate attributeName="cx" values="350;370;350" dur="7s" repeatCount="indefinite"/>
    </circle>

    <!-- Corner Brackets -->
    <g stroke="#00D9FF" stroke-width="1.5" fill="none" opacity="0.5">
      <line x1="20" y1="35" x2="20" y2="20"/>
      <line x1="20" y1="20" x2="35" y2="20"/>
    </g>
    <g stroke="#00D9FF" stroke-width="1.5" fill="none" opacity="0.5">
      <line x1="1180" y1="35" x2="1180" y2="20"/>
      <line x1="1180" y1="20" x2="1165" y2="20"/>
    </g>
    <g stroke="#FFD700" stroke-width="1.5" fill="none" opacity="0.4">
      <line x1="20" y1="265" x2="20" y2="280"/>
      <line x1="20" y1="280" x2="35" y2="280"/>
    </g>
    <g stroke="#FFD700" stroke-width="1.5" fill="none" opacity="0.4">
      <line x1="1180" y1="265" x2="1180" y2="280"/>
      <line x1="1180" y1="280" x2="1165" y2="280"/>
    </g>

    <!-- Code Decoration Left -->
    <g font-family="monospace" fill="#00D9FF" opacity="0.12">
      <text x="30" y="80"  font-size="11">import tensorflow as tf</text>
      <text x="30" y="100" font-size="11">import torch.nn as nn</text>
      <text x="30" y="120" font-size="11">from transformers import *</text>
      <text x="30" y="160" font-size="11">model.fit(X_train, y_train)</text>
      <text x="30" y="180" font-size="11">accuracy = 0.9847</text>
      <text x="30" y="220" font-size="11">print("AI Engineer")</text>
    </g>

    <!-- Stats Decoration Right -->
    <g font-family="monospace" fill="#FFD700" opacity="0.10">
      <text x="870" y="80"  font-size="11">commits: 122+</text>
      <text x="870" y="100" font-size="11">repos:   8+</text>
      <text x="870" y="120" font-size="11">streak:  active</text>
      <text x="870" y="160" font-size="11">target:  MSc AI</text>
      <text x="870" y="180" font-size="11">goal:    Europe</text>
      <text x="870" y="220" font-size="11">status:  building</text>
    </g>

    <!-- Center Line -->
    <line x1="0" y1="195" x2="1200" y2="195"
          stroke="url(#lineGrad)" stroke-width="1" opacity="0.4">
      <animate attributeName="opacity" values="0.2;0.6;0.2"
               dur="3s" repeatCount="indefinite"/>
    </line>

    <!-- Main Name -->
    <text x="600" y="120"
          font-family="Segoe UI, Arial, sans-serif"
          font-size="58" font-weight="700"
          fill="#FFFFFF" text-anchor="middle"
          filter="url(#textGlow)" letter-spacing="2">
      Mohammad Zunayed
    </text>

    <!-- Animated Underline -->
    <rect x="600" y="128" width="0" height="2" rx="1" fill="#00D9FF">
      <animate attributeName="width" values="0;500" dur="1.5s" fill="freeze"/>
      <animate attributeName="x"     values="600;350" dur="1.5s" fill="freeze"/>
    </rect>

    <!-- Subtitle -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.8s"
               begin="1s" fill="freeze"/>
      <text x="600" y="165"
            font-family="monospace"
            font-size="18" fill="#00D9FF"
            text-anchor="middle" letter-spacing="4">
        DATA SCIENTIST  ·  AI ENGINEER  ·  RESEARCHER
      </text>
    </g>

    <!-- Bottom Tag -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.8s"
               begin="1.5s" fill="freeze"/>
      <rect x="400" y="210" width="400" height="36" rx="18"
            fill="#00D9FF" fill-opacity="0.08"
            stroke="#00D9FF" stroke-width="0.8" stroke-opacity="0.4"/>
      <text x="600" y="233"
            font-family="monospace" font-size="13"
            fill="#FFFFFF" text-anchor="middle" opacity="0.85">
        Targeting MSc in AI — Europe 2025/26
      </text>
    </g>

    <!-- Pulse Dot -->
    <circle cx="415" cy="233" r="4" fill="#00FF88">
      <animate attributeName="r"       values="4;6;4" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
    </circle>

    <!-- Scan Line -->
    <rect width="1200" height="2" fill="#00D9FF" opacity="0.04">
      <animate attributeName="y" values="-2;302" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Border -->
  <rect width="1200" height="300" rx="12"
        fill="none" stroke="#30363D" stroke-width="1"/>
</svg>
