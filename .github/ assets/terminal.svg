
<svg width="600" height="200" viewBox="0 0 600 200"
     xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="termGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#161B22"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>
  </defs>

  <!-- Terminal Window -->
  <rect width="600" height="200" rx="10" fill="url(#termGrad)"
        stroke="#30363D" stroke-width="1"/>

  <!-- Title Bar -->
  <rect width="600" height="32" rx="10" fill="#21262D"/>
  <rect width="600" height="16" y="16" fill="#21262D"/>

  <!-- Traffic Lights -->
  <circle cx="20" cy="16" r="6" fill="#FF5F57"/>
  <circle cx="40" cy="16" r="6" fill="#FFBD2E"/>
  <circle cx="60" cy="16" r="6" fill="#28C840"/>

  <!-- Title -->
  <text x="300" y="21" font-family="monospace" font-size="12"
        fill="#8B949E" text-anchor="middle">terminal — zunayed@ai-lab</text>

  <!-- Terminal Lines -->
  <text x="20" y="60" font-family="monospace" font-size="13" fill="#00D9FF">
    $ whoami
  </text>
  <text x="20" y="82" font-family="monospace" font-size="13" fill="#FFFFFF">
    Mohammad Zunayed — AI Engineer
  </text>
  <text x="20" y="110" font-family="monospace" font-size="13" fill="#00D9FF">
    $ python train.py --model transformer
  </text>
  <text x="20" y="132" font-family="monospace" font-size="13" fill="#00FF88">
    ✓ Epoch 100/100 — Loss: 0.0023 — Acc: 98.47%
  </text>
  <text x="20" y="160" font-family="monospace" font-size="13" fill="#00D9FF">
    $ echo $GOAL
  </text>
  <text x="20" y="182" font-family="monospace" font-size="13" fill="#FFD700">
    MSc Artificial Intelligence — Europe 2026
  </text>

  <!-- Blinking Cursor -->
  <rect x="20" y="188" width="9" height="14" fill="#00D9FF">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
